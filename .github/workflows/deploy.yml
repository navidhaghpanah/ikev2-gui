name: Deploy panel to VPS

on:
  push:
    branches: [main]
    paths:
      - "panel/**"
      - "clients/**"
      - "scripts/deploy.sh"
      - "scripts/multivpn"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check deploy secrets
        id: check
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$KEY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY empty — skip SSH. Use sudo multivpn update on the VPS, or set those secrets."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        if: steps.check.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: sudo bash -c 'curl -fsSL -o /tmp/deploy.sh https://raw.githubusercontent.com/navidhaghpanah/multivpn-panel/main/scripts/deploy.sh && bash /tmp/deploy.sh main'
