name: Deploy panel to VPS

on:
  push:
    branches: [main]
    paths:
      - "panel/**"
      - "clients/**"
      - "scripts/deploy.sh"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: sudo bash -c 'curl -fsSL -o /tmp/deploy.sh https://raw.githubusercontent.com/navidhaghpanah/multivpn-panel/main/scripts/deploy.sh && bash /tmp/deploy.sh main'
